### Frontmatter - mandatory. If not applicable, leave blank.
# template can either be specified as either the relative or absolute path to the inputs.
template: 'input_file.in'
database: 'database.dbs'
aqueous_database: 'aqueous_database.dbs'
catabolic_pathways: 'CatabolicPathways.in'

# Timeout in seconds for any given input file.
timeout: 20
# conditions must match geochemical condition names in concentration dict
conditions:
    - 'initial'
# Number of files in this run.
number_of_files: 7

# For parallel Omphalos only...
nodes: 100

### End frontmatter
# All keywords from here on are optional.
# Options for setting parameters:
#     linspace
#       Takes an array of length 3, [x, y, z] where x and y are the upper and lower bounds of the range.
#       z is the number of times a given value is repeated. E.g. 1 1 1 2 2 2 3 3 3  for z = 3.
#     random_uniform
#       Takes an array of length two, [lower, upper] for the upper and lower bounds on the uniform random sample.
#     constant
#       Takes a float. Will be held constant over all runs.
#     custom
#       Allows for a manually specified list of input values. Takes an array of length number_of_files.
#     fix_ratio
#       Fixes the value of an input as a fixed multiple of another input parameter. Useful for keeping isotope ratios
#       fixed when the major isotope concentration is being varied.
#
# Parameter setting takes the form
# keyword_section
#   geochemical_condition_name
#     condition_entry (e.g. species concentration, pH, temperature etc.)
#       - parameter option
#       - parameter option args
parameters:
  initial:
    pH:
      - 'linspace'
      - [4,11,1]

namelists:
  aqueous:
    reaction_name:
      parameter_name:
        - 'random_uniform'
        - [0,1]
  aqueous_kinetics:
    reaction_name:
      parameter_name:
        - 'random_uniform'
        - [0,1]
  catabolic_pathways:

# Parameters in the thermodynamic database named by 'database' above. Nested
# section -> entry -> parameter. Sections are primary_species, secondary_species, gases, minerals,
# surface_complexation, mineral_kinetics, exchange and surface_complexation_parameters.
database_parameters:
  exchange:
    exchange_species_name:
      log_k:
        - 'linspace'
        - [-1.2, -0.6, 1]
  mineral_kinetics:
    mineral_name:
      rate(25C):
        - 'random_uniform'
        - [-9.0, -8.0]

# Recompute the database's log K columns with pyGCC before any sweep. Needs pygcc >= 1.5.3.
# Only the log K columns are rewritten; stoichiometry, weights, the kinetics block and the
# exchange block are left exactly as they are, so fitted values survive.
database_logk:
  sourcedb: 'thermo.2021'
  sourceformat: 'GWB'          # GWB | EQ36 | PHREEQC | Pflotran | ToughReact
  reactions: 'all'             # or a list of species/mineral names
  on_unmatched: 'warn'         # warn | error | leave
  pressure: 500                # bar; omit for the water saturation curve
  Dielec_method: 'JN91'
  heatcap_method: 'SUPCRT'
  densityextrap: false

# Add an isotope of an element: every species containing it is duplicated under a labelled name,
# with the reaction rewritten onto the labelled parent and the log Ks copied unchanged.
database_isotopes:
  - element: 'Ca'
    label: 44
    parents: ['Ca++']         # inferred from names if omitted, but a name is not proof of content
    species: ['CaCO3(aq)']    # restrict the copies; their dependencies are added too
    mass_shift: 4             # per atom; derived as label - atomic weight if omitted
    # The aqueous kinetics namelist and catabolic pathways are duplicated too.
    reaction_names:           # for namelist reaction names the formula rule cannot derive
      Sulfate_reduction: 'Sulfate34_reduction'
    keq_offset: -0.002        # equilibrium fractionation; kinetic goes in the deck's rates
